name: InfraAgent shadow gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest tests.test_infra tests.test_automate -v
      - name: Automate all demo stories
        run: python3 -m infra.automate
      - name: Shadow pass + calm telemetry
        env:
          GATE_ACTOR: ${{ github.actor }}
        run: |
          python3 -m infra vendor/unified_framework/examples/checkov_pass.json \
            --telemetry vendor/unified_framework/examples/telemetry_ok.json \
            --export-evidence artifacts/evidence \
            --traffic-intent artifacts/traffic \
            --service ci
      - uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: artifacts/
